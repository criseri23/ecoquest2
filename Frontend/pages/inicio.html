<!DOCTYPE html>

  <link rel="stylesheet" href="../css/escanear.css?v=26">

<body>

      </div>

      </div>
      <div class="home-capybara home-capybara-idle" data-capybara-animation="idle" data-capybara-speed="1500" aria-hidden="true">

      </a>
      <a class="home-level-link home-level-link-bag level-link-2" href="misiones.html" aria-label="Nivel 2 misiones">

      </a>
