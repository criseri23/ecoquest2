<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#184b35">
  <title>EcoQuest · Elegí cómo entrar</title>
  <link rel="stylesheet" href="../css/escanear.css?v=12">
  <link rel="stylesheet" href="../css/welcome.css?v=1">
</head>
<body>
  <main class="app-shell welcome-shell">
    <section class="welcome-card choice-card" aria-labelledby="choiceTitle">
      <img class="welcome-logo" src="../img/logoia-crop.png" alt="EcoQuest">
      <div class="welcome-art" aria-hidden="true"><img src="../img/carpincho-crop.png" alt=""></div>
      <p class="welcome-eyebrow">TU AVENTURA EMPIEZA ACÁ</p>
      <h1 id="choiceTitle">¿Cómo querés entrar?</h1>
      <p class="welcome-copy">Con una cuenta podés guardar tu progreso y aparecer en el ranking.</p>
      <div class="choice-actions">
        <button id="btnLogin" class="welcome-primary" type="button">Iniciar sesión</button>
        <button id="btnRegistro" class="welcome-option" type="button">Crear una cuenta</button>
        <button id="btnGuest" class="welcome-guest" type="button">Probar como invitada · sin guardar progreso</button>
      </div>
      <p class="welcome-footnote">Como invitada podés recorrer la app. El XP y los datos empiezan de cero y no se guardan.</p>
    </section>
  </main>
  <script src="../js/ecoquest-account.js?v=5"></script>
  <script src="../js/elegir.js?v=3"></script>
</body>
</html>
