<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>EcoQuest - Misiones y logros de CABA</title>
  <link rel="stylesheet" href="../css/escanear.css?v=29">
  <link rel="stylesheet" href="../css/misiones.css?v=3">
<link rel="stylesheet" href="../css/ecoquest-layout.css?v=4">
</head>
<body>
  <main class="app-shell achievements-shell">
    <header class="eco-header" aria-label="Tu progreso en EcoQuest">
      <a class="eco-brand" href="inicio.html" aria-label="EcoQuest, inicio"><img src="../img/logoia-crop.png" alt="EcoQuest"></a>
      <div class="eco-stats">
        <span class="eco-stat" aria-label="Experiencia">🍃 <b id="missionXp" data-total-xp>0</b> XP</span>
        <span class="eco-stat">⭐ Nivel <b data-level>1</b></span>
        <a class="eco-stat" href="calendario.html" title="Ver calendario y racha">🔥 Racha <b id="missionStreak" data-streak>0</b></a>
      </div>
    </header>
    <section class="achievements-scroll" aria-label="Misiones y logros de CABA" tabindex="0">
      <header class="achievements-heading">
        <svg class="achievement-art" viewBox="0 192 1080 162" preserveAspectRatio="none" aria-hidden="true"><image href="../img/cosoverde.png" width="1080" height="1920"/></svg>
        <h1>Misiones</h1>
        <p>Desbloqueá recompensas reciclando</p>
      </header>

      <div id="achievementsList" class="achievements-list"></div>
      <section id="streakAchievements" class="streak-achievements"></section>
      <footer class="achievements-footer"><strong>Reciclamos en CABA</strong><p>Validá tus residuos en los contenedores del mapa de la Ciudad de Buenos Aires.</p><a href="mapa.html">Ver contenedores de CABA</a></footer>
      <noscript><p>Activá JavaScript para ver tus logros y el progreso de reciclaje.</p></noscript>
    </section>
    <nav class="bottom-nav" aria-label="Navegacion principal">
      <a class="nav-item" href="inicio.html">
        <img src="../img/inicio-crop.png" alt="" aria-hidden="true">
        <span>Inicio</span>
      </a>
      <a class="nav-item active" href="misiones.html">
        <img src="../img/tareas-crop.png" alt="" aria-hidden="true">
        <span>Misiones</span>
      </a>
      <a class="nav-item" href="ranking.html">
        <img src="../img/ranking-crop.png" alt="" aria-hidden="true">
        <span>Ranking</span>
      </a>
      <a class="nav-item" href="mapa.html">
        <img src="../img/mapa-crop.png" alt="" aria-hidden="true">
        <span>Mapa</span>
      </a>
      <a class="nav-item" href="mascota.html">
        <img src="../img/carpincho-crop.png" alt="" aria-hidden="true">
        <span>Mascota</span>
      </a>
      <a class="nav-item" href="config.html">
        <img src="../img/ajustes-crop.png" alt="" aria-hidden="true">
        <span>Config</span>
      </a>
    </nav>
  </main>
  <script src="../js/ecoquest-account.js?v=3"></script>
<script src="../js/ecoquest-rules.js?v=1"></script>
<script src="../js/ecoquest-state.js?v=6"></script>
<script src="../js/ecoquest-activity.js?v=1"></script>
  <script src="../js/misiones.js?v=4"></script>
</body>
</html>
