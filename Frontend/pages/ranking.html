<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>EcoQuest - Ranking</title>
  <link rel="stylesheet" href="../css/escanear.css?v=9">
</head>
<body>
  <main class="app-shell">
    <header class="brand-bar">
      <img src="../img/logoia-crop.png" alt="EcoQuest" class="brand-logo">
    </header>

    <section class="scan-panel" aria-label="Ranking">
      <article class="page-panel">
        <h1>Ranking</h1>
        <p>Consulta tu progreso, compara tu XP y sigue subiendo con cada escaneo correcto.</p>

        <div class="progress-summary" aria-label="Resumen de progreso">
          <div>
            <span>XP total</span>
            <strong id="rankingScore">0</strong>
          </div>
          <div>
            <span>Escaneos</span>
            <strong id="rankingScans">0</strong>
          </div>
          <div>
            <span>Correctos</span>
            <strong id="rankingSuccess">0</strong>
          </div>
        </div>

        <ol class="ranking-list" aria-label="Tabla de posiciones">
          <li>
            <span>1. EcoMaster</span>
            <strong>120 XP</strong>
          </li>
          <li class="current-player">
            <span>2. Vos</span>
            <strong id="rankingPlayerScore">0 XP</strong>
          </li>
          <li>
            <span>3. Reciclador</span>
            <strong>35 XP</strong>
          </li>
        </ol>
      </article>
    </section>

    <nav class="bottom-nav" aria-label="Navegacion principal">
      <a class="nav-item" href="inicio.html">
        <img src="../img/inicio-crop.png" alt="" aria-hidden="true">
        <span>Inicio</span>
      </a>
      <a class="nav-item" href="misiones.html">
        <img src="../img/tareas-crop.png" alt="" aria-hidden="true">
        <span>Misiones</span>
      </a>
      <a class="nav-item active" href="ranking.html">
        <img src="../img/ranking-crop.png" alt="" aria-hidden="true">
        <span>Ranking</span>
      </a>
      <a class="nav-item" href="mapa.html">
        <img src="../img/mapa-crop.png" alt="" aria-hidden="true">
        <span>Mapa</span>
      </a>
      <a class="nav-item" href="mascota.html">
        <img src="../img/carpincho-crop.png" alt="" aria-hidden="true">
        <span>Mascota</span>
      </a>
      <a class="nav-item" href="config.html">
        <img src="../img/ajustes-crop.png" alt="" aria-hidden="true">
        <span>Config</span>
      </a>
    </nav>
  </main>
  <script src="../js/ranking.js?v=1"></script>
</body>
</html>
