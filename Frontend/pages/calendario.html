<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>EcoQuest · Calendario</title><link rel="stylesheet" href="../css/calendario.css?v=3"><link rel="stylesheet" href="../css/ecoquest-layout.css?v=4">
</head>
<body><main class="calendar-app">
<header class="eco-header" aria-label="Tu progreso en EcoQuest">
      <a class="eco-brand" href="inicio.html" aria-label="EcoQuest, inicio"><img src="../img/logoia-crop.png" alt="EcoQuest"></a>
      <div class="eco-stats">
        <span class="eco-stat" aria-label="Experiencia">🍃 <b data-total-xp>0</b> XP</span>
        <span class="eco-stat">⭐ Nivel <b data-level>1</b></span>
        <a class="eco-stat" href="calendario.html" title="Ver calendario y racha">🔥 Racha <b data-streak>0</b></a>
      </div>
    </header>
<section class="calendar-board" aria-label="Calendario de desafíos">
<header class="month-heading"><svg class="month-wood" viewBox="0 65 2172 545" preserveAspectRatio="xMidYMid meet" aria-hidden="true"><image href="../img/superiormadera.png" width="2172" height="724"/></svg><button id="previousMonth" aria-label="Mes anterior">❮</button><h1 id="monthName"></h1><button id="nextMonth" aria-label="Mes siguiente">❯</button><small id="yearLabel"></small></header>
<div class="calendar-lower"><svg class="lower-wood" viewBox="24 465 1080 868" preserveAspectRatio="none" aria-hidden="true"><image href="../img/ChatGPT Image 14 sept 2026, 21_18_25.png" width="1127" height="1403"/></svg>
<div class="month-progress"><strong>Tu progreso<br>del mes</strong><progress id="monthProgress" value="0" max="31" aria-label="Desafíos del mes"></progress><span><b id="monthCount"></b><br>desafíos</span></div>
<div class="calendar-grid-wrap"><div class="weekdays" aria-hidden="true"><span>LUN</span><span>MAR</span><span>MIÉ</span><span>JUE</span><span>VIE</span><span>SÁB</span><span>DOM</span></div><div id="calendarDays" class="calendar-days"></div></div>
</div></section>
<section class="streak-banner"><div class="future-capybara" aria-hidden="true"></div><div class="streak-message"><h2>¡Mantén tu racha!</h2><p id="nextMessage"></p></div><div class="next-reward">Próxima recompensa<span aria-hidden="true">🎁</span><strong id="nextXp"></strong></div></section>
<nav class="bottom-nav" aria-label="Navegacion principal">
      <a class="nav-item active" href="inicio.html">
        <img src="../img/inicio-crop.png" alt="" aria-hidden="true">
        <span>Inicio</span>
      </a>
      <a class="nav-item" href="misiones.html">
        <img src="../img/tareas-crop.png" alt="" aria-hidden="true">
        <span>Misiones</span>
      </a>
      <a class="nav-item" href="ranking.html">
        <img src="../img/ranking-crop.png" alt="" aria-hidden="true">
        <span>Ranking</span>
      </a>
      <a class="nav-item" href="mapa.html">
        <img src="../img/mapa-crop.png" alt="" aria-hidden="true">
        <span>Mapa</span>
      </a>
      <a class="nav-item" href="mascota.html">
        <img src="../img/carpincho-crop.png" alt="" aria-hidden="true">
        <span>Mascota</span>
      </a>
      <a class="nav-item" href="config.html">
        <img src="../img/ajustes-crop.png" alt="" aria-hidden="true">
        <span>config</span>
      </a>
    </nav>
<details class="reward-help"><summary>Cómo ganás experiencia</summary><div id="rewardRules"></div><a href="misiones.html">Ver todos mis logros</a></details>
<dialog id="dayDialog"><button id="closeDay" aria-label="Cerrar">✕</button><h2 id="dayTitle"></h2><p id="dayDescription"></p><a id="dayAction" href="escanear.html">Escanear un residuo</a></dialog>
</main><script src="../js/ecoquest-account.js?v=3"></script><script src="../js/ecoquest-rules.js"></script><script src="../js/ecoquest-state.js?v=6"></script><script src="../js/ecoquest-activity.js"></script><script src="../js/calendario.js"></script></body></html>
