<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#184b35">
  <title>EcoQuest · Bienvenida</title>
  <link rel="stylesheet" href="../css/escanear.css?v=12">
  <link rel="stylesheet" href="../css/welcome.css?v=2">
</head>
<body>
  <main class="app-shell welcome-shell">
    <section class="welcome-card" aria-labelledby="welcomeTitle">
      <img class="welcome-logo" src="../img/logoia-crop.png" alt="EcoQuest">
      <div class="welcome-art" aria-hidden="true">
        <span class="welcome-leaf welcome-leaf-one">✦</span>
        <span class="welcome-leaf welcome-leaf-two">✿</span>
        <img src="../img/carpincho-crop.png" alt="">
      </div>
      <p class="welcome-eyebrow">PEQUEÑAS ACCIONES, UN GRAN CAMBIO</p>
      <h1 id="welcomeTitle">¡Hola, ecoexploradora!</h1>
      <p class="welcome-copy">Reciclá, descubrí puntos verdes y avanzá a tu ritmo.</p>
      <nav class="choice-actions welcome-entry-actions" aria-label="Opciones para entrar a EcoQuest">
        <a class="welcome-primary" href="login.html" data-account-entry>Iniciar sesión</a>
        <a class="welcome-option" href="registro.html" data-account-entry>Registrarse</a>
        <button id="guestButton" class="welcome-guest" type="button">Entrar como invitada</button>
      </nav>
      <p class="welcome-footnote">Con tu cuenta podés volver a iniciar sesión. Como invitada, el progreso no se guarda.</p>
    </section>
  </main>
  <script src="../js/ecoquest-account.js?v=5"></script>
  <script src="../js/click.js?v=4"></script>
</body>
</html>
