<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EcoQuest · Crear cuenta</title><link rel="stylesheet" href="../css/escanear.css?v=12"><link rel="stylesheet" href="../css/ecoquest-layout.css?v=4"><link rel="stylesheet" href="../css/auth.css"></head><body><main class="app-shell auth-shell"><header class="eco-header" aria-label="Tu progreso en EcoQuest">
      <a class="eco-brand" href="inicio.html" aria-label="EcoQuest, inicio"><img src="../img/logoia-crop.png" alt="EcoQuest"></a>
      <div class="eco-stats">
        <span class="eco-stat" aria-label="Experiencia">🍃 <b data-total-xp>0</b> XP</span>
        <span class="eco-stat">⭐ Nivel <b data-level>1</b></span>
        <a class="eco-stat" href="calendario.html" title="Ver calendario y racha">🔥 Racha <b data-streak>0</b></a>
      </div>
    </header><section class="auth-content" aria-label="Crear cuenta"><h1 class="sr-only">Crear cuenta</h1><svg class="auth-hero" viewBox="0 142 1080 710" aria-hidden="true"><image href="../img/registrousuario.png" width="1080" height="1920"/></svg><form id="registroForm"><label for="nombre">Nombre de usuario</label><input id="nombre" name="nombre" minlength="3" maxlength="24" autocomplete="nickname" required><label for="email">Email</label><input id="email" name="email" type="email" maxlength="254" autocomplete="username" required><label for="contraseña">Contraseña</label><input id="contraseña" name="password" type="password" maxlength="128" autocomplete="new-password" required><small>Al menos 8 caracteres. Tu perfil participa en el ranking de CABA.</small><button type="submit">Crear cuenta</button></form><p id="mensaje" role="status"></p><div class="auth-links"><a href="login.html">Ya tengo cuenta</a><a href="inicio.html">Continuar como invitado</a></div></section></main><script src="../js/ecoquest-account.js?v=3"></script><script src="../js/ecoquest-rules.js"></script><script src="../js/ecoquest-state.js?v=6"></script><script src="../js/ecoquest-activity.js"></script><script src="../js/registro.js?v=2"></script></body></html>
