<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EcoQuest · Iniciar sesión</title><link rel="stylesheet" href="../css/escanear.css?v=12"><link rel="stylesheet" href="../css/ecoquest-layout.css?v=4"><link rel="stylesheet" href="../css/auth.css"></head><body><main class="app-shell auth-shell"><header class="eco-header" aria-label="Tu progreso en EcoQuest">
      <a class="eco-brand" href="inicio.html" aria-label="EcoQuest, inicio"><img src="../img/logoia-crop.png" alt="EcoQuest"></a>
      <div class="eco-stats">
        <span class="eco-stat" aria-label="Experiencia">🍃 <b data-total-xp>0</b> XP</span>

    </header><section class="auth-content" aria-label="Iniciar sesión"><h1 class="sr-only">Iniciar sesión</h1><svg class="auth-hero" viewBox="0 142 1080 650" aria-hidden="true"><image href="../img/iniciarsesion.png" width="1080" height="1920"/></svg><form id="loginForm"><label for="email">Email o nombre de tu cuenta anterior</label><input id="email" name="email" type="text" maxlength="254" autocomplete="username" required><label for="contraseña">Contraseña</label><input id="contraseña" name="password" type="password" maxlength="128" autocomplete="current-password" required><button type="submit">Iniciar sesión</button></form><p id="mensaje" role="status"></p><div class="auth-links"><a href="registro.html">Crear cuenta</a><a href="inicio.html">Continuar como invitado</a></div></section></main><script src="../js/ecoquest-account.js?v=3"></script><script src="../js/ecoquest-rules.js"></script><script src="../js/ecoquest-state.js?v=6"></script><script src="../js/ecoquest-activity.js"></script><script src="../js/login.js?v=2"></script></body></html>
